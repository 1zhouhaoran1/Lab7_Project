# ============================================================
# Lab 7 - nginx configuration for the "web" service
# Mounted into the official nginx image by web/Dockerfile.
# ============================================================
server {
    listen       80;              # container port 80, mapped to host 8080
    server_name  _;

    root  /usr/share/nginx/html;  # where Dockerfile copies index.html
    index index.html;

    # Static frontend page
    location / {
        try_files $uri $uri/ =404;
    }

    # API reverse proxy:
    # the browser calls the relative path /api/..., nginx forwards it to
    # http://backend:8000 using the compose SERVICE NAME "backend"
    # (never "localhost" - that would point at the web container itself).
    # Trailing slash on proxy_pass strips the /api/ prefix:
    #   /api/calc?a=3  ->  http://backend:8000/calc?a=3
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }
}
